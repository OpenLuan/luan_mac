name: LuanMac
options:
  bundleIdPrefix: com.luanmac
  developmentLanguage: en
  createIntermediateGroups: true
  # Pin the Xcode project format to Xcode 15 (objectVersion 70). Newer
  # XcodeGen defaults to format 77 (Xcode 16), which CI's Xcode 15 cannot
  # open ("future Xcode project file format").
  objectVersion: "70"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    ENABLE_BITCODE: NO
    CLANG_WARN_STRICT_PROTOTYPES: NO
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    CLANG_ENABLE_MODULES: NO
    CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES
    GCC_PREFIX_HEADER: LuanMac/LuanMac.pch
    GCC_PRECOMPILE_PREFIX_HEADER: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    HEADER_SEARCH_PATHS: >
      $(inherited)
      $(SRCROOT)/lua-apple/luafan2/src
      $(SRCROOT)/lua-apple
      $(SRCROOT)/lua-apple/platform/libevent-config/macos
      $(SRCROOT)/lua-apple/libevent/include
      $(SRCROOT)/lua-apple/third_party/brotli/c/include
      $(SRCROOT)/lua-apple/lua53
      $(SRCROOT)/lua-apple/utlua
      $(SRCROOT)/lua-apple/utlua/core
      # lua-openssl Lua 5.3 compat header (private.h/auxiliar.c include it;
      # compat-5.3.c is inlined by the header, so the dir is header-only)
      $(SRCROOT)/lua-apple/third_party/lua-openssl/deps/lua-compat/c-api
      # lua-openssl auxiliary class helper (deps submodule of lua-openssl)
      $(SRCROOT)/lua-apple/third_party/lua-openssl/deps/auxiliar
      $(SRCROOT)/lua-apple/third_party/lua-openssl/src
      # Generated OpenSSL 3.x public headers (build output of
      # scripts/build_xcframeworks.sh). The libcrypto/libssl xcframeworks
      # are intentionally created WITHOUT headers: both targets link them and
      # would race on $(BUILT_PRODUCTS_DIR)/include/openssl/* otherwise.
      $(SRCROOT)/Frameworks/openssl-headers/include
    # Main binary links against stock libcurl (OpenSSL backend). Browser TLS
    # fingerprinting (curl-impersonate) is deliberately NOT compiled into the
    # main process — it is delivered as a separate stdio MCP subprocess so
    # the Apple-side CBB_add_space / ossl_chain_get_der leak observed in
    # Curl_vtls_apple_verify cannot accumulate in the long-lived luan
    # process. The Lua binding (luan/curl-impersonate/luacurlimp.c) still
    # exposes a curlimp interface and resolves curl_easy_impersonate to a
    # no-op stub via LUAFAN_CURLIMP_MOCK; fingerprinted requests are
    # expected to be routed to the external MCP server.
    OTHER_CFLAGS: >
      $(inherited)
      -DLUA_USE_MACOSX
      -DLUA_COMPAT_5_1
      -DLUA_COMPAT_5_2
      -DLUA_COMPAT_FLOATSTRING
      -DHAVE_CONFIG_H
      -DLUA_USER_H="<luauser.h>"
      -DOPENSSL_NO_MD2
      -DMACOS_CLASSIC
      -DFAN_HAS_OPENSSL
      -DFAN_WITH_OPENSSL=1
      -DFAN_WITH_ZLIB=1
      -DFAN_WITH_CURL=1
      -DFAN2_SOURCE=1
      -Dluaopen_fan=luaopen_fan
      -DFAN_WITH_SQLITE3=1
      -DSQLITE_ENABLE_MEMORY_MANAGEMENT
      -DSQLITE_DEFAULT_LOCKING_MODE=1
      -DTUNNEL_IN_MAIN_TARGET
      -DPAL_NO_TUNNEL
      -DLUAFAN_CURLIMP_MOCK=1

# Exclude noise / non-macOS sources under lua-apple when scanning the tree.
# sqlite3.c / openssl / lua53 / libevent are re-added as explicit source entries
# (often with -w). Linux/Android PAL stay out of the macOS app target.
luafan2Excludes: &luafan2Excludes
  - "main.c"
  - "db/mariadb.c"
  - "db/sqlite3.c"
  - "docs"
  - "examples"
  - "tests"
  - ".github"
  - ".circleci"
  - "*.md"
  - "*.rockspec"
  - "Makefile*"
  - "configure*"
  - "CMakeLists.txt"

luaAppleExcludes: &luaAppleExcludes
  - "luafan2"
  - "utlua/sqlite3.c"
  - "utlua/brotli/common"
  - "utlua/brotli/dec"
  - "utlua/brotli/enc"
  - "utlua/brotli/fuzz"
  - "utlua/brotli/include"
  - "utlua/brotli/tools"
  - "lua53/**"
  # lmd5.c is #include'd by ldigest.c — do not compile as its own TU.
  - "utlua/algorithm/lmd5.c"
  - "utlua/**/*.txt"
  - "third_party/brotli"
  - "third_party/lua-openssl"
  # OpenSSL source submodule must never enter the Xcode targets: its
  # include/openssl/*.h (and *.h.in) headers are built into the
  # Frameworks/lib{crypto,ssl}.xcframework (see scripts/build_xcframeworks.sh).
  # Including them here produces "Multiple commands produce
  # $(BUILT_PRODUCTS_DIR)/include/openssl/..." for both targets (they share
  # BUILT_PRODUCTS_DIR) and duplicates the framework headers.
  - "third_party/openssl"
  - "libevent"
  # Docs / license / patch artifacts must not enter the Xcode target.
  - "patches"
  - "THIRD_PARTY.md"
  - "**/*.diff"
  - "**/*.sh"
  - "**/*.md"
  - "**/*.txt"
  - "**/*.yml"
  - "**/Dockerfile*"
  - "**/LICENSE*"
  - "**/Makefile*"
  - "**/*.rockspec"

libeventExcludes: &libeventExcludes
  - "include"
  # Official upstream tree also ships tests / samples / build scaffolding
  # (test/, sample/, cmake/, m4/, WIN32-Code/, ...) — keep them out of the
  # macOS target when libevent is added as a submodule.
  - "test"
  - "test-export"
  - "sample"
  - "cmake"
  - "m4"
  - "WIN32-Code"
  - "extra"
  - "compat"
  - ".github"
  - "buffer_iocp.c"
  - "bufferevent_async.c"
  - "event_iocp.c"
  - "evthread_win32.c"
  - "win32select.c"
  - "arc4random.c"
  - "devpoll.c"
  - "epoll_sub.c"
  - "evport.c"
  # Root-level upstream scaffolding (pkg-config templates, man pages,
  # scripts, docs, build files) must not be copied into the app bundle.
  - "**/*.md"
  - "**/*.txt"
  - "**/*.sh"
  - "**/*.py"
  - "**/*.in"
  - "**/*.cmake"
  - "**/*.m4"
  - "**/*.am"
  - "**/*.3"
  - "**/*.sed"
  - "**/Makefile*"
  - "**/CMakeLists.txt"
  - "**/configure.ac"
  - "**/autogen.sh"
  - "**/ChangeLog*"
  - "**/Doxyfile"
  - "**/LICENSE*"
  - "**/.clang-format"
  - "**/.mailmap"
  - "**/.gitignore"
  - "**/Vagrantfile"

# Official github.com/lua/lua tree also ships the standalone interpreter,
# internal test harness, and build scaffolding — keep them out of targets.
lua53Excludes: &lua53Excludes
  - "lua.c"
  - "ltests.c"
  - "ltests.h"
  - "makefile"
  - "Makefile"
  - "bugs"
  - "**/*.md"
  - "**/*.txt"
  - "**/*.diff"
  - "**/LICENSE*"
  - "**/.gitignore"
  - "**/.git"

targets:
  LuanMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LuanMac
        excludes:
          - "Info.plist"
          - "LuanMac.entitlements"
          - "LuanMac-Bridging-Header.h"
          - "LuaCLI-Bridging-Header.h"
          - "LuaBridge.m"
          - "LuaBridge.h"
      - path: runtime
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - sdk: libresolv.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libldap.tbd
      - sdk: SystemConfiguration.framework
      # Stock libcurl (OpenSSL backend). Browser TLS fingerprinting is
      # split out into a separate stdio MCP subprocess — see the top-level
      # OTHER_CFLAGS comment for the rationale. Link order matters:
      # libcurl.a has undefined OpenSSL / OCSP / X509 / EVP / BIO symbols
      # that must be resolved from libssl + libcrypto, and HTTP/2 symbols
      # (nghttp2_*) must come from libnghttp2. Keep order libcurl → libssl
      # → libcrypto → libnghttp2. All four are static .a inside
      # xcframeworks; no embed step is needed.
      # SystemConfiguration provides SCDynamicStoreCopyProxies used by
      # Curl_macos_init for proxy auto-detection.
      - framework: Frameworks/libcurl.xcframework
        embed: false
      - framework: Frameworks/libssl.xcframework
        embed: false
      - framework: Frameworks/libcrypto.xcframework
        embed: false
      - framework: Frameworks/libnghttp2.xcframework
        embed: false
      # The main binary does NOT link libcurl-impersonate (see top-level
      # comment). It is embedded here so the curl-impersonate-mcp
      # subprocess can dlopen it via @executable_path/../Frameworks when
      # running out of the installed app bundle.
      - framework: Frameworks/libcurl-impersonate.xcframework
        embed: true
        codeSignOnCopy: true
      - target: luan
        embed: false
      # Pulls the stdio MCP server into the LuanMac build graph; the
      # resulting binary is copied into Contents/MacOS/ below.
      - target: curl-impersonate-mcp
        embed: false
    postBuildScripts:
      - name: Copy luan CLI and runtime resources
        script: |
          if [ -f "${BUILT_PRODUCTS_DIR}/luan" ]; then
            cp "${BUILT_PRODUCTS_DIR}/luan" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/luan"
            codesign --force --sign - "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/luan"
          fi
          if [ -f "${BUILT_PRODUCTS_DIR}/curl-impersonate-mcp" ]; then
            cp "${BUILT_PRODUCTS_DIR}/curl-impersonate-mcp" \
               "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/curl-impersonate-mcp"
            codesign --force --sign - \
               "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/curl-impersonate-mcp"
          fi
          if [ -d "${SRCROOT}/runtime" ]; then
            rm -rf "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/runtime"
            mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
            cp -R "${SRCROOT}/runtime" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/runtime"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanmac.LuanMac
        INFOPLIST_FILE: LuanMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: LuanMac/LuanMac.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: LuanMac/LuanMac-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        ENABLE_HARDENED_RUNTIME: YES

  luan:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LuanCLI
      # Luan-owned native file scanner; do not add this to luafan2/fan.so.
      - path: luan/native/file_scan.c
        compilerFlags: -w
      - path: LuanMac/LuaBridge.m
        compilerFlags: -w
      - path: LuanMac/LuaBridge.h
      # LuaFan v2 native runtime. Keep the standalone interpreter out.
      - path: lua-apple/luafan2/src
        excludes: *luafan2Excludes
        compilerFlags: -DFAN2_SOURCE=1 -Dluaopen_fan=luaopen_fan
      - path: lua-apple
        excludes: *luaAppleExcludes
      - path: lua-apple/luafan2/src/db/sqlite3.c
        compilerFlags: -w
      - path: lua-apple/utlua/sqlite3.c
        compilerFlags: -w
      # lua-openssl: compile directly from the submodule (no patched copy).
      # src/ is the upstream C sources; deps/auxiliar is the lua-openssl
      # dependency submodule (lua-auxiliar) that src/*.c #include.
      - path: lua-apple/third_party/lua-openssl/src
        excludes:
          # ec.c #includes these; never compile them as separate TUs
          - "ec_util.c"
          - "group.c"
          - "point.c"
        compilerFlags: -w
      - path: lua-apple/third_party/lua-openssl/deps/auxiliar
        excludes:
          - "**/*.md"
          - "**/*.gitignore"
        compilerFlags: -w
      - path: lua-apple/third_party/brotli/c
        excludes:
          - "tools"
          - "fuzz"
          - "common/*.bin"
          - "common/*.br"
        compilerFlags: -w
      - path: lua-apple/libevent
        excludes: *libeventExcludes
        compilerFlags: -w
      - path: lua-apple/lua53
        excludes: *lua53Excludes
        compilerFlags: -w
    dependencies:
      - sdk: libresolv.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libldap.tbd
      - sdk: libsqlite3.tbd
      - sdk: SystemConfiguration.framework
      # Stock libcurl (OpenSSL backend); see LuanMac target above and the
      # top-level OTHER_CFLAGS comment for the full rationale (fingerprinting
      # lives in a separate stdio MCP subprocess, not in-process).
      # Static .a; link order libcurl → libssl → libcrypto → libnghttp2
      # resolves BIO/SSL/X509/EVP/OCSP + HTTP/2 (nghttp2_*) symbols in
      # libcurl.a.
      - framework: Frameworks/libcurl.xcframework
        embed: false
      - framework: Frameworks/libssl.xcframework
        embed: false
      - framework: Frameworks/libcrypto.xcframework
        embed: false
      - framework: Frameworks/libnghttp2.xcframework
        embed: false
    # Stock libcurl is a static .a inside libcurl.xcframework, so the previous
    # "Multiple commands produce libcurl-impersonate.4.dylib" hazard is gone:
    # nothing is embedded, and the luan standalone binary at
    # ${BUILT_PRODUCTS_DIR}/luan can be launched directly. The LD_RUNPATH
    # entries below are kept as-is for forward compatibility.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanmac.luan
        SWIFT_OBJC_BRIDGING_HEADER: LuanMac/LuaCLI-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        LD_RUNPATH_SEARCH_PATHS: >
          $(inherited)
          @executable_path
          @executable_path/../Frameworks

  curl-impersonate-mcp:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    # Minimal stdio MCP server that wraps libcurl-impersonate. See
    # curl-impersonate-mcp/README.md for the protocol and lifecycle.
    # Builds into ${BUILT_PRODUCTS_DIR}/curl-impersonate-mcp and is copied
    # into Contents/MacOS/ by the LuanMac post-build phase so the main
    # process (which no longer links libcurl-impersonate) can spawn it as
    # a subprocess.
    #
    # Why no `framework: Frameworks/libcurl-impersonate.xcframework` dep
    # entry: the main LuanMac target already pulls that xcframework for
    # bundle embed, and `libcurl.xcframework` (vanilla, main process)
    # also publishes a `curl/` header dir. Xcode copies both header dirs
    # into ${BUILT_PRODUCTS_DIR}/include/curl/ which collides. We dodge
    # the collision by referencing the impersonate slice directly here
    # via HEADER_SEARCH_PATHS + OTHER_LDFLAGS, without going through the
    # framework-dep plumbing that triggers the header copy phase.
    sources:
      - path: curl-impersonate-mcp
        includes:
          - "*.c"
    settings:
      base:
        PRODUCT_NAME: curl-impersonate-mcp
        # Strip the main runtime's global defines and prefix header; this
        # target is plain C99 + libcurl-impersonate's curl.h.
        OTHER_CFLAGS: >
          -Wall
          -Wextra
          -std=c99
        GCC_PREFIX_HEADER: ""
        GCC_PRECOMPILE_PREFIX_HEADER: NO
        CLANG_ENABLE_MODULES: NO
        # Use vanilla libcurl's headers directly from its xcframework
        # slice. The impersonate xcframework's own Headers dir is
        # intentionally NOT published (its Info.plist drops HeadersPath
        # so Xcode will not race with the main LuanMac target over
        # `include/curl/`). The only extra symbol we need —
        # curl_easy_impersonate — is declared via `extern` in main.c and
        # resolved at link time against -lcurl-impersonate.4.
        HEADER_SEARCH_PATHS: >
          $(SRCROOT)/Frameworks/libcurl.xcframework/macos-arm64_x86_64/Headers
        LIBRARY_SEARCH_PATHS: >
          $(SRCROOT)/Frameworks/libcurl-impersonate.xcframework/macos-arm64_x86_64
        OTHER_LDFLAGS: >
          -lcurl-impersonate.4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        # Find the embedded dylib via @loader_path (= dir of the binary).
        # In the installed bundle the binary sits in Contents/MacOS/ and
        # libcurl-impersonate.4.dylib sits in Contents/Frameworks/ — reach
        # it with ../Frameworks. For local ${BUILT_PRODUCTS_DIR} runs the
        # dylib sits next to the binary, so @loader_path alone works.
        LD_RUNPATH_SEARCH_PATHS: >
          $(inherited)
          @loader_path
          @loader_path/../Frameworks

schemes:
  LuanMac:
    build:
      targets:
        LuanMac: all
  luan:
    build:
      targets:
        luan: all
  curl-impersonate-mcp:
    build:
      targets:
        curl-impersonate-mcp: all
